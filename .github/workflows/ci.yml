name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php: ['8.3', '8.4', '8.5']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, mbstring
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run PHPUnit
        run: vendor/bin/phpunit

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --configuration=phpstan.neon.dist

  context-explain-dogfood:
    if: github.event_name == 'pull_request'
    name: Govern context explain through agent-loop
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout candidate recall compiler
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout coordinated agent-loop workflow engine
        uses: actions/checkout@v4
        with:
          repository: voku/agent-loop
          ref: agent/workspace-root
          path: build/agent-loop
          persist-credentials: false

      - name: Checkout agent-learning main
        uses: actions/checkout@v4
        with:
          repository: voku/agent-learning
          ref: main
          path: build/agent-learning
          persist-credentials: false

      - name: Checkout agent-session main
        uses: actions/checkout@v4
        with:
          repository: voku/agent-session
          ref: main
          path: build/agent-session
          persist-credentials: false

      - name: Checkout agent-kanban main
        uses: actions/checkout@v4
        with:
          repository: voku/agent-kanban
          ref: main
          path: build/agent-kanban
          persist-credentials: false

      - name: Checkout agent-map main
        uses: actions/checkout@v4
        with:
          repository: voku/agent-map
          ref: main
          path: build/agent-map
          persist-credentials: false

      - name: Checkout first-party operating prompt catalog
        uses: actions/checkout@v4
        with:
          repository: voku/agent-skills
          ref: c7e9d8bdda59d957600bca8dc9f787f03286b277
          path: build/agent-skills
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: json, mbstring, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      - name: Install candidate package development dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Configure coordinated candidate dependencies
        run: |
          php -r '
          $path = "build/agent-loop/composer.json";
          $data = json_decode(file_get_contents($path), true, 512, JSON_THROW_ON_ERROR);
          $data["repositories"] = [
              ["type" => "path", "url" => getcwd(), "options" => ["symlink" => false, "versions" => ["voku/agent-recall-compiler" => "0.10.999"]]],
              ["type" => "path", "url" => getcwd() . "/build/agent-learning", "options" => ["symlink" => false, "versions" => ["voku/agent-learning" => "0.8.999"]]],
              ["type" => "path", "url" => getcwd() . "/build/agent-session", "options" => ["symlink" => false, "versions" => ["voku/agent-session" => "0.3.999"]]],
              ["type" => "path", "url" => getcwd() . "/build/agent-kanban", "options" => ["symlink" => false, "versions" => ["voku/agent-kanban" => "0.2.999"]]],
              ["type" => "path", "url" => getcwd() . "/build/agent-map", "options" => ["symlink" => false, "versions" => ["voku/agent-map" => "0.5.999"]]],
          ];
          file_put_contents($path, json_encode($data, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR) . PHP_EOL);
          '

      - name: Install coordinated agent-loop with this recall compiler
        run: composer update --working-dir=build/agent-loop --no-interaction --prefer-dist --no-progress

      - name: Lint dogfood runner
        run: bash -n tools/context-explain-dogfood.sh

      - name: Run governed context-explain dogfood
        run: bash tools/context-explain-dogfood.sh

      - name: Upload dogfood evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: context-explain-dogfood-${{ github.sha }}
          if-no-files-found: warn
          path: |
            build/context-explain-dogfood
            build/context-explain-targeted
            .agent-loop/recall/ARC-17
            .agent-loop/sessions
            .agent-loop/runs/ARC-17
