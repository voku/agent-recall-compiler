name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php: ['8.3', '8.4', '8.5']

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, mbstring
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run PHPUnit
        run: vendor/bin/phpunit

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --configuration=phpstan.neon.dist

  context-explain-dogfood:
    if: github.event_name == 'pull_request'
    name: Govern context explain through agent-loop
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout candidate recall compiler
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Confirm exact candidate head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Checkout released-set-verified agent-loop baseline
        uses: actions/checkout@v7
        with:
          repository: voku/agent-loop
          ref: bf0f04bc0689e5dbbffc2872a8ddc77ca576da9f
          path: build/agent-loop
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: json, mbstring, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      - name: Install candidate package development dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Stage Recall candidate outside nested consumer checkout
        shell: bash
        run: |
          set -euo pipefail
          candidate="${RUNNER_TEMP}/agent-recall-candidate"
          rm -rf "${candidate}"
          mkdir -p "${candidate}"
          git archive HEAD | tar -x -C "${candidate}"

      - name: Configure pinned released dependency set with this Recall candidate
        run: |
          php -r '
          $path = "build/agent-loop/composer.json";
          $data = json_decode(file_get_contents($path), true, 512, JSON_THROW_ON_ERROR);
          $data["repositories"] = [
              ["type" => "path", "url" => getenv("RUNNER_TEMP") . "/agent-recall-candidate", "options" => ["symlink" => false, "versions" => ["voku/agent-recall-compiler" => "0.15.999"]]],
          ];
          $data["require"]["voku/agent-kanban"] = "0.4.2";
          $data["require"]["voku/agent-learning"] = "0.16.1";
          $data["require"]["voku/agent-map"] = "^0.20.0";
          $data["require"]["voku/agent-recall-compiler"] = "0.15.999";
          $data["require"]["voku/agent-session"] = "0.7.0";
          file_put_contents($path, json_encode($data, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR) . PHP_EOL);
          '

      - name: Install pinned agent-loop with this Recall candidate
        run: composer update --working-dir=build/agent-loop --no-interaction --prefer-dist --no-progress

      - name: Verify installed consumer exploration CLI
        shell: bash
        run: |
          set -euo pipefail
          bin="build/agent-loop/vendor/bin/agent-recall-compiler"
          php "$bin" prompt explore > build/agent-loop-explore-prompt.txt
          php -r '
          require "build/agent-loop/vendor/autoload.php";
          $expected = (new voku\AgentRecallCompiler\Reflection\ExplorePromptBuilder())->build() . PHP_EOL;
          $actual = file_get_contents("build/agent-loop-explore-prompt.txt");
          if ($actual === false || $actual !== $expected) {
              throw new RuntimeException("Installed consumer explore CLI differs from installed builder.");
          }
          if (!str_contains($actual, "NOTHING_TO_EXPLORE")
              || !str_contains($actual, "non-mutating")
              || !str_contains($actual, "Do not plan or authorize implementation")) {
              throw new RuntimeException("Installed consumer explore prompt lost inquiry/authority boundaries.");
          }
          echo "Installed explore prompt SHA-256: ", hash("sha256", $actual), PHP_EOL;
          '
          if php "$bin" prompt explore --scope project >/dev/null 2>&1; then
            echo 'Invalid explore arguments were accepted by installed consumer.' >&2
            exit 1
          fi

      - name: Lint dogfood runner
        run: php -l tools/context-explain-dogfood.php

      - name: Run governed context-explain dogfood
        run: php tools/context-explain-dogfood.php

      - name: Probe exact vs discovery Recall context on the current owner map
        shell: bash
        run: |
          set -euo pipefail
          php -l tools/context-selection-probe.php
          php tools/context-selection-probe.php

      - name: Prove released Learning 0.18.5 numeric identity bridge in installed consumer
        shell: bash
        run: |
          set -euo pipefail
          php -r '
          $path = "build/agent-loop/composer.json";
          $data = json_decode(file_get_contents($path), true, 512, JSON_THROW_ON_ERROR);
          $data["require"]["voku/agent-learning"] = "0.18.5";
          file_put_contents($path, json_encode($data, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR) . PHP_EOL);
          '
          composer update voku/agent-learning --working-dir=build/agent-loop --with-dependencies --no-interaction --prefer-dist --no-progress
          test "$(composer show --working-dir=build/agent-loop voku/agent-learning --format=json | php -r '$data=json_decode(stream_get_contents(STDIN), true, 512, JSON_THROW_ON_ERROR); echo $data["versions"][0];')" = "0.18.5"
          php -r '
          require "build/agent-loop/vendor/autoload.php";
          $root = sys_get_temp_dir() . "/agent-recall-numeric-owner-" . bin2hex(random_bytes(6));
          $projection = (new voku\AgentRecallCompiler\Provider\AgentLearningNoteProjectionSource())->forTask($root, "403");
          $observation = $projection->observation();
          $expected = [["identity_id" => "403", "depth" => 0]];
          if (($observation["identity_depths"] ?? null) !== $expected) {
              throw new RuntimeException("Released Learning 0.18.5 numeric identity bridge was not preserved.");
          }
          '

      - name: Upload dogfood evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: context-explain-dogfood-${{ github.event.pull_request.head.sha }}
          if-no-files-found: warn
          path: |
            build/agent-loop/composer.lock
            build/agent-loop-explore-prompt.txt
            build/context-explain-dogfood
            build/context-explain-targeted
            build/context-selection-probe
            .agent-loop/recall/ARC-17
            .agent-loop/sessions
            .agent-loop/runs/ARC-17
