name: Connector patch task-aware Learning

on:
  push:
    branches:
      - chatgpt/152-task-aware-learning-precedents
    paths:
      - .github/workflows/connector-patch-task-aware-learning.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chatgpt/152-task-aware-learning-precedents
          fetch-depth: 0

      - name: Apply guarded patch
        run: python .github/scripts/connector-patch-task-aware-learning.py

      - name: Commit patched consumer path
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/connector-patch-task-aware-learning.yml
          rm .github/scripts/connector-patch-task-aware-learning.py
          git diff --check
          git diff -- src/Provider/AgentLearningNoteProjectionSource.php src/Provider/LearningNoteRecallProvider.php composer.json tests/AgentLearningNoteProjectionSourceTest.php tests/LearningNoteRecallProviderTest.php
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Provider/AgentLearningNoteProjectionSource.php src/Provider/LearningNoteRecallProvider.php composer.json tests/AgentLearningNoteProjectionSourceTest.php tests/LearningNoteRecallProviderTest.php .github/workflows/connector-patch-task-aware-learning.yml .github/scripts/connector-patch-task-aware-learning.py
          git commit -m 'feat(learning): forward task context to bounded owner query'
          git push origin HEAD:chatgpt/152-task-aware-learning-precedents
