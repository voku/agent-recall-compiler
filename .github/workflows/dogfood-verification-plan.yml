name: Dogfood verification-plan implementation

on:
  push:
    branches:
      - feat/deterministic-verification-plans

permissions:
  contents: write

jobs:
  agent-loop:
    if: ${{ hashFiles('.github/verification-implementation.tar.gz.b64') != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: json, mbstring
          coverage: none

      - name: Materialize bounded implementation
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/verification-implementation.tar.gz.b64 | tar --extract --gzip

      - name: Install project dependencies
        run: composer install --prefer-dist --no-progress

      - name: Install current agent-loop
        run: |
          composer global config minimum-stability dev
          composer global require voku/agent-loop:dev-main --prefer-dist --no-progress --no-interaction
          echo "${COMPOSER_HOME:-$HOME/.config/composer}/vendor/bin" >> "$GITHUB_PATH"

      - name: Plan, approve, and prepare target-aware edit
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${COMPOSER_HOME:-$HOME/.config/composer}/vendor/bin:$PATH"
          git config user.name "agent-loop dogfood"
          git config user.email "agent-loop-dogfood@example.invalid"

          agent-loop init scaffold
          agent-loop workflow plan ARC-5 \
            --by "OpenAI GPT-5.6 Thinking" \
            --file src/Command/CompileCommand.php \
            --file src/Verification/VerificationPlanCompiler.php \
            --file tests/VerificationPlanTest.php \
            --goal "Compile deterministic verification plans and verifier-owned answer keys for target-aware recall." \
            --scope src/Verification/ \
            --scope src/Command/CompileCommand.php \
            --scope tests/VerificationPlanTest.php \
            --non-goal "Do not execute validation commands or objective gates while compiling a plan." \
            --non-goal "Do not invoke an LLM judge, calculate rewards, or ingest verification episodes." \
            --behavior-anchor "approved task brief -> target-aware map evidence -> public verification plan and verifier-owned key" \
            --validation "composer test" \
            --validation "composer phpstan"

          agent-loop workflow approve ARC-5 --by "Lars Moelleken"
          agent-loop workflow context ARC-5 --max-lines 240 --max-bytes 30000 > .agent-loop/ARC-5.context.txt

          agent-loop edit 'voku\AgentRecallCompiler\Command\CompileCommand::run' \
            --task ARC-5-EDIT \
            --dry-run \
            --runner stdout \
            --output-dir .agent-loop/edit/ARC-5-EDIT \
            -- "Implement issue #5: deterministic knowledge probes, evidence checklist items, declared objective gates, strict separation of verification-plan.json from verification-key.json, canonical hashing, and regression tests."

          test -f .agent-loop/edit/ARC-5-EDIT/recall/verification-plan.json
          test -f .agent-loop/edit/ARC-5-EDIT/recall/verification-key.json
          ! grep -q 'accepted_answers' .agent-loop/edit/ARC-5-EDIT/recall/verification-plan.json
          grep -q 'accepted_answers' .agent-loop/edit/ARC-5-EDIT/recall/verification-key.json
          find .agent-loop session_plan -maxdepth 5 -type f -print | sort > .agent-loop/ARC-5.artifacts.txt

      - name: Validate implementation
        shell: bash
        run: |
          set -euo pipefail
          composer validate --strict
          composer test
          composer phpstan

      - name: Upload dogfood artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agent-loop-arc-5-implementation
          path: |
            .agent-loop/
            session_plan/
          include-hidden-files: true
          if-no-files-found: error

      - name: Commit bounded implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "agent-loop dogfood"
          git config user.email "agent-loop-dogfood@example.invalid"
          git clean -fd -- .agent-loop session_plan todo tasks infra
          rm -f .github/verification-implementation.tar.gz.b64
          rm -f .github/workflows/dogfood-verification-plan.yml
          git add src/Verification src/Command/CompileCommand.php tests/VerificationPlanTest.php .github
          git commit -m "feat: compile deterministic verification plans"
          git push origin HEAD:feat/deterministic-verification-plans
