name: Export target recall working copy

on:
  push:
    branches:
      - feat/target-aware-map-recall
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - run: tar --exclude-vcs -czf /tmp/agent-recall-compiler-working-copy.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: agent-recall-compiler-working-copy
          path: /tmp/agent-recall-compiler-working-copy.tar.gz
          retention-days: 1
