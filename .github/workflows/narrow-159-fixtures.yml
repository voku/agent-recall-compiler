name: Apply narrow Learning fixture patch

on:
  push:
    branches:
      - pre-1.0/152-bounded-learning-precedent
    paths:
      - .github/workflows/narrow-159-fixtures.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Apply patch
        run: php tools/patch-159-fixtures.php
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/RecallCompilerTest.php
          if test -z "$(git status --porcelain -- tests/RecallCompilerTest.php)"; then
            exit 0
          fi
          git commit -m 'test(learning): scope lineage setup to compile fixtures'
          git push origin HEAD:pre-1.0/152-bounded-learning-precedent
