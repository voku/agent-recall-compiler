name: Native JSON Recall shadow index (experimental)

on:
  pull_request:
    paths:
      - '.github/workflows/native-json-recall-shadow.yml'
      - 'experiments/native-json-recall/**'
      - 'examples/end-to-end/**'
      - 'resources/skills/agent-recall-consumer/operating-prompts.metadata.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-json-shadow:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout canonical JSON owner
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install native build requirements
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential libsqlite3-dev

      - name: Obtain pinned public native tokmem
        shell: bash
        env:
          TOKMEM_SHA: 39880c39e0d5af2bff5c3ba5f91c0b94aecbbff8
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/hparadiz/Navi-Brain.git "$RUNNER_TEMP/navi-brain"
          git -C "$RUNNER_TEMP/navi-brain" checkout --detach "$TOKMEM_SHA"
          test "$(git -C "$RUNNER_TEMP/navi-brain" rev-parse HEAD)" = "$TOKMEM_SHA"
          make -C "$RUNNER_TEMP/navi-brain/memories"

      - name: Validate current JSON provenance against live native retrieval
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 -m py_compile experiments/native-json-recall/probe.py
          python3 experiments/native-json-recall/probe.py \
            --root "$GITHUB_WORKSPACE" \
            --binary "$RUNNER_TEMP/navi-brain/memories/build/tokmem" \
            --output evidence/native-json-recall.json

      - name: Upload reproducible evidence (even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-json-recall-proof
          path: evidence/native-json-recall.json
          retention-days: 14
          if-no-files-found: warn
