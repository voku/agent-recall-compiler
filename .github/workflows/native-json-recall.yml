name: Native JSON Recall candidate (experimental)

on:
  pull_request:
    paths:
      - '.github/workflows/native-json-recall.yml'
      - 'experiments/navi-json-recall/**'
      - 'resources/skills/agent-recall-consumer/operating-prompts.json'
      - 'resources/skills/agent-recall-consumer/operating-prompts.metadata.json'
      - 'src/Selection/**'
      - 'tests/Selection/**'
      - 'src/OperatingPromptCatalog.php'
      - 'src/OperatingPromptRecipe.php'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-json-recall:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout current JSON source and experimental revalidator
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Enforce metadata recall contracts before native build
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s experiments/navi-json-recall -p 'test_*.py' -v

      - name: Install native build requirements
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential libsqlite3-dev

      - name: Fetch exact public upstream (no native code vendored)
        shell: bash
        env:
          NAVI_SHA: 39880c39e0d5af2bff5c3ba5f91c0b94aecbbff8
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/hparadiz/Navi-Brain.git "$RUNNER_TEMP/navi-brain"
          git -C "$RUNNER_TEMP/navi-brain" checkout --detach "$NAVI_SHA"
          test "$(git -C "$RUNNER_TEMP/navi-brain" rev-parse HEAD)" = "$NAVI_SHA"

      - name: Compile native memory implementation from pinned upstream
        run: make -C "$RUNNER_TEMP/navi-brain/memories"

      - name: Prove that native candidates must revalidate against owner JSON
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 experiments/navi-json-recall/probe.py \
            --binary "$RUNNER_TEMP/navi-brain/memories/build/tokmem" \
            --source resources/skills/agent-recall-consumer/operating-prompts.json \
            --output evidence/native-json-recall.json

      - name: Compare native activation vs SQLite FTS5 vs exact JSON under matched byte budgets
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile experiments/navi-json-recall/probe.py experiments/navi-json-recall/benchmark.py
          python3 experiments/navi-json-recall/benchmark.py \
            --binary "$RUNNER_TEMP/navi-brain/memories/build/tokmem" \
            --source resources/skills/agent-recall-consumer/operating-prompts.json \
            --queries experiments/navi-json-recall/held-out-queries.json \
            --challenge experiments/navi-json-recall/issue-challenge-queries.json \
            --output evidence/native-json-benchmark.json

      - name: Upload structured experimental evidence even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-json-recall-evidence
          retention-days: 14
          if-no-files-found: warn
          path: |
            evidence/native-json-recall.json
            evidence/native-json-benchmark.json

  offline-json-baseline:
    name: Source-backed JSON/SQLite baseline (no native build)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout authoritative JSON and experimental evaluator
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run offline unit and metadata safety tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s experiments/navi-json-recall -p 'test_*.py' -v

      - name: Evaluate 46 source-backed queries without C binary or daemon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 experiments/navi-json-recall/offline_baseline.py \
            --source resources/skills/agent-recall-consumer/operating-prompts.json \
            --metadata resources/skills/agent-recall-consumer/operating-prompts.metadata.json \
            --queries experiments/navi-json-recall/held-out-queries.json \
            --challenge experiments/navi-json-recall/issue-challenge-queries.json \
            --output evidence/offline-json-recall.json

      - name: Evaluate candidate fusion without changing catalog or invoking a model
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/navi-json-recall/candidate_fusion_ablation.py \
            --source resources/skills/agent-recall-consumer/operating-prompts.json \
            --metadata resources/skills/agent-recall-consumer/operating-prompts.metadata.json \
            --queries experiments/navi-json-recall/blind_holdout_queries.json \
            --output evidence/candidate-fusion-ablation.json

      - name: Replay committed local-model transcript against current source and candidates
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/navi-json-recall/replay_blind_holdout.py \
            --source resources/skills/agent-recall-consumer/operating-prompts.json \
            --metadata resources/skills/agent-recall-consumer/operating-prompts.metadata.json \
            --queries experiments/navi-json-recall/blind_holdout_queries.json \
            --recorded experiments/navi-json-recall/evidence/blind-holdout-benchmark.json \
            --output evidence/blind-holdout-replay.json

      - name: Replay all 18 agent-loop project decisions against current JSON
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/navi-json-recall/replay_agent_loop_project.py \
            --source resources/skills/agent-recall-consumer/operating-prompts.json \
            --metadata resources/skills/agent-recall-consumer/operating-prompts.metadata.json \
            --queries experiments/navi-json-recall/agent_loop_project_queries.json \
            --recorded experiments/navi-json-recall/evidence/agent-loop-project-benchmark.json \
            --output evidence/agent-loop-project-replay.json

      - name: Replay recorded A/B contrast without a live model
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/navi-json-recall/replay_applicability_ab.py \
            --source resources/skills/agent-recall-consumer/operating-prompts.json \
            --metadata resources/skills/agent-recall-consumer/operating-prompts.metadata.json \
            --queries experiments/navi-json-recall/applicability_ab_queries.json \
            --recorded experiments/navi-json-recall/evidence/applicability-ab-benchmark.json \
            --output evidence/applicability-ab-replay.json

      - name: Upload offline JSON baseline independently of native availability
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: offline-json-recall-evidence
          retention-days: 14
          if-no-files-found: warn
          path: |
            evidence/offline-json-recall.json
            evidence/blind-holdout-replay.json
            evidence/candidate-fusion-ablation.json
            evidence/applicability-ab-replay.json
            evidence/agent-loop-project-replay.json

  php-owner-matrix:
    name: Exact-head Composer CI (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, mbstring
          coverage: none
          tools: composer:v2

      - name: Install project dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run owner Composer CI
        run: composer ci

      - name: Verify A/B local transcript through actual PHP bounded choice validator
        shell: bash
        run: |
          set -euo pipefail
          php -l experiments/navi-json-recall/verify_php_applicability_ab.php
          php experiments/navi-json-recall/verify_php_applicability_ab.php \
            experiments/navi-json-recall/evidence/applicability-ab-benchmark.json

      - name: Replay all 18 project decisions through actual PHP validator
        shell: bash
        run: |
          set -euo pipefail
          php experiments/navi-json-recall/verify_php_blind_replay.php \
            experiments/navi-json-recall/evidence/agent-loop-project-benchmark.json

      - name: Replay all 26 recorded local-model decisions against strict PHP validator
        shell: bash
        run: |
          set -euo pipefail
          php -l experiments/navi-json-recall/verify_php_blind_replay.php
          php experiments/navi-json-recall/verify_php_blind_replay.php \
            experiments/navi-json-recall/evidence/blind-holdout-benchmark.json
