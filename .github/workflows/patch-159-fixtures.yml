name: Patch bounded Learning owner fixtures

on:
  push:
    branches:
      - pre-1.0/152-bounded-learning-precedent
    paths:
      - .github/workflows/patch-159-fixtures.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Make Recall fixtures explicit Learning owner state
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source_test = Path('tests/AgentLearningNoteProjectionSourceTest.php')
          text = source_test.read_text()
          text = text.replace(
              "self::assertSame('0.18.0', InstalledVersions::getPrettyVersion('voku/agent-learning'));",
              "self::assertSame('0.18.1', InstalledVersions::getPrettyVersion('voku/agent-learning'));",
          )
          source_test.write_text(text)

          test = Path('tests/RecallCompilerTest.php')
          text = test.read_text()
          text = text.replace(
              "use PHPUnit\\Framework\\TestCase;\n",
              "use PHPUnit\\Framework\\TestCase;\nuse voku\\AgentLearning\\LearningLineageService;\n",
              1,
          )
          text = text.replace(
              "['agent-learning', 'memory', 'task-context'],",
              "['agent-learning', 'agent-learning-notes', 'memory', 'task-context'],",
              1,
          )
          old = """        file_put_contents($this->root . '/proposals/approved/' . $id . '.json', json_encode([\n            'schema_version' => '1.0',\n            'id' => $id,"""
          if old not in text:
              raise SystemExit('writeProposal anchor not found')
          # Keep the existing proposal body untouched; add owner-valid source state and rebuild after it is written.
          end = """        ], JSON_PRETTY_PRINT | JSON_THROW_ON_ERROR));\n    }\n\n    private function buildEventDraft"""
          replacement = """        ], JSON_PRETTY_PRINT | JSON_THROW_ON_ERROR));\n\n        $findingDirectory = $this->root . '/findings/validated';\n        if (!is_dir($findingDirectory) && !mkdir($findingDirectory, 0777, true) && !is_dir($findingDirectory)) {\n            self::fail('Unable to create Learning finding fixture directory.');\n        }\n        file_put_contents($findingDirectory . '/finding.2026-06-18.001.json', json_encode([\n            'id' => 'finding.2026-06-18.001',\n            'task_id' => 'PROJECT-123',\n            'session' => 'session_recall_fixture',\n            'created_at' => '2026-06-18T09:00:00+00:00',\n            'created_by' => 'test',\n            'scope' => ['src/Auth'],\n            'observation' => 'The Recall fixture carries one approved auth guidance proposal.',\n            'evidence' => [[\n                'type' => 'file_reference',\n                'path' => 'src/Auth/UserService.php',\n                'line' => 1,\n            ]],\n            'hypothesis' => 'The approved proposal should remain eligible for the matching auth task.',\n            'validated_conclusion' => 'The fixture represents one validated Learning source for the approved proposal.',\n            'confidence' => 'high',\n            'validation_status' => 'validated',\n            'status' => 'validated',\n            'sensitivity' => 'public',\n        ], JSON_PRETTY_PRINT | JSON_THROW_ON_ERROR));\n\n        (new LearningLineageService())->rebuild($this->root, $this->root);\n    }\n\n    private function buildEventDraft"""
          if end not in text:
              raise SystemExit('writeProposal end anchor not found')
          text = text.replace(end, replacement, 1)
          test.write_text(text)
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/AgentLearningNoteProjectionSourceTest.php tests/RecallCompilerTest.php
          git commit -m 'test(learning): make bounded owner fixtures explicit'
          git push origin HEAD:pre-1.0/152-bounded-learning-precedent
