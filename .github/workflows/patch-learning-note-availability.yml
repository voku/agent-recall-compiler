name: Patch LearningNote availability

on:
  push:
    branches: [feature/learning-note-recall-145]
    paths: ['.github/workflows/patch-learning-note-availability.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/learning-note-recall-145
      - name: Bind conditional provider availability to root config
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/Compilation/RecallCompilationService.php')
          text = path.read_text()
          old = 'static fn (RecallProvider $provider): bool => !$provider instanceof ConditionalRecallProvider || $provider->isAvailable(),'
          new = 'static fn (RecallProvider $provider): bool => !$provider instanceof ConditionalRecallProvider || $provider->isAvailable($rootConfig),'
          if text.count(old) != 1:
              raise SystemExit(f'expected one availability call, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          rm .github/workflows/patch-learning-note-availability.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Compilation/RecallCompilationService.php .github/workflows/patch-learning-note-availability.yml
          git commit -m 'fix(recall): evaluate optional provider per root'
          git push origin HEAD:feature/learning-note-recall-145
