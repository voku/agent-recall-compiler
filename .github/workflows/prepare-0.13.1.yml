name: Prepare 0.13.1 release metadata

on:
  push:
    branches: [release/0.13.1]
    paths:
      - '.github/workflows/prepare-0.13.1.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/0.13.1
          fetch-depth: 0
      - name: Insert release metadata surgically
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('CHANGELOG.md')
          text = path.read_text()
          marker = '## [0.13.0] - 2026-08-15'
          section = '''## [0.13.1] - 2026-08-16

          ### Fixed

          - `regression-hunt` now treats `minimum_findings` as a bounded probe budget
            instead of a required defect count. Completed evidence-backed probes may
            return `CLEAN`, missing material evidence may return `BLOCKED`, and the
            recipe explicitly forbids manufacturing defects to satisfy the numeric floor.

          ### Validation

          - PR #74 passed the package CI matrix and pins the CLEAN/BLOCKED and
            anti-defect-quota contract in `RegressionHuntPromptContractTest`.

          '''
          if '## [0.13.1] - 2026-08-16' in text:
              raise SystemExit('0.13.1 section already exists')
          if marker not in text:
              raise SystemExit('0.13.0 anchor missing')
          path.write_text(text.replace(marker, section + marker, 1))
          PY
          mkdir -p .release
          cat > .release/0.13.1.json <<'JSON'
          {
            "target_sha": "3beda1f4be8d71d91987f628ae047ab8048485f5",
            "version": "0.13.1"
          }
          JSON
          rm .github/workflows/prepare-0.13.1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md .release/0.13.1.json .github/workflows/prepare-0.13.1.yml
          git diff --cached --check
          git commit -m 'release: prepare 0.13.1'
          git push origin HEAD:release/0.13.1
