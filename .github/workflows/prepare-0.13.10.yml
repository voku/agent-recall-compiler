name: Prepare 0.13.10 release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-0.13.10.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Prepare exact release metadata
        shell: bash
        run: |
          set -euo pipefail
          target='0c7ea2f88b28b6fe32a0c231ef1e2361af5ccfec'
          git merge-base --is-ancestor "${target}" HEAD

          php <<'PHP'
          <?php
          declare(strict_types=1);

          $path = 'CHANGELOG.md';
          $text = file_get_contents($path);
          if ($text === false) {
              throw new RuntimeException('Cannot read CHANGELOG.md');
          }

          $unreleasedHeading = "## [Unreleased]\n";
          $nextRelease = "## [0.13.9] - 2026-08-19\n";
          if (substr_count($text, $unreleasedHeading) !== 1) {
              throw new RuntimeException('Unreleased changelog heading is not unique');
          }
          if (substr_count($text, $nextRelease) !== 1) {
              throw new RuntimeException('0.13.9 changelog anchor is not unique');
          }
          if (str_contains($text, '## [0.13.10] - 2026-08-20')) {
              throw new RuntimeException('0.13.10 section already exists');
          }

          $unreleasedStart = strpos($text, $unreleasedHeading);
          $nextReleaseStart = strpos($text, $nextRelease);
          if ($unreleasedStart === false || $nextReleaseStart === false || $nextReleaseStart <= $unreleasedStart) {
              throw new RuntimeException('Cannot locate the unreleased changelog body');
          }

          $bodyStart = $unreleasedStart + strlen($unreleasedHeading);
          $body = trim(substr($text, $bodyStart, $nextReleaseStart - $bodyStart));
          $expectedBody = <<<'CHANGELOG'
          ### Fixed

          - Stop a file's navigation fact from absorbing the relation graph of every sibling that shares an inherited base class. A map file entry also lists the parents its own symbols extend, so an external base such as `PHPUnit\Framework\TestCase` is attributed to every file inheriting it; matching incoming relations against those shared ids grew with the square of the inheriting files. On a 311-file repository one test file's fact carried 88,179 relations (33.7 MB) instead of 949 (0.39 MB), and the compiled bundle reached 124 MB. Symbols listed under more than one file are now excluded from that matching, since a symbol listed by several files is declared by none of them. Files that declare their own symbols are unaffected.
          CHANGELOG;
          if ($body !== trim($expectedBody)) {
              throw new RuntimeException('Unreleased changelog changed since the 0.13.10 release target was selected');
          }

          $section = <<<'CHANGELOG'
          ## [Unreleased]

          ## [0.13.10] - 2026-08-20

          ### Fixed

          - Stop a file's navigation fact from absorbing the relation graph of every sibling that shares an inherited base class. A map file entry also lists the parents its own symbols extend, so an external base such as `PHPUnit\Framework\TestCase` is attributed to every file inheriting it; matching incoming relations against those shared ids grew with the square of the inheriting files. On a 311-file repository one test file's fact carried 88,179 relations (33.7 MB) instead of 949 (0.39 MB), and the compiled bundle reached 124 MB. Symbols listed under more than one file are now excluded from that matching, since a symbol listed by several files is declared by none of them. Files that declare their own symbols are unaffected.

          ### Validation

          - PR #99 passed the PHP 8.3, 8.4, and 8.5 PHPUnit/PHPStan matrix plus governed `agent-loop` dogfood on exact head `c6ce6edb896499db8c2bd28eea1b0bc1e53da977`; no review threads or submitted review findings remained before merge.

          CHANGELOG;

          $updated = substr($text, 0, $unreleasedStart) . $section . substr($text, $nextReleaseStart);
          if (file_put_contents($path, $updated) === false) {
              throw new RuntimeException('Failed to write 0.13.10 changelog');
          }
          PHP

          mkdir -p .release
          cat > .release/0.13.10.json <<'JSON'
          {
            "target_sha": "0c7ea2f88b28b6fe32a0c231ef1e2361af5ccfec",
            "version": "0.13.10"
          }
          JSON

          rm .github/workflows/prepare-0.13.10.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md .release/0.13.10.json .github/workflows/prepare-0.13.10.yml
          git diff --cached --check
          git commit -m 'release: prepare 0.13.10'
          git tag -a '0.13.10' "${target}" -m 'agent-recall-compiler 0.13.10'
          git push --atomic origin HEAD:main refs/tags/0.13.10
