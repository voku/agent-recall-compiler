name: Prepare 0.13.12 release

on:
  push:
    branches: [release/0.13.12]
    paths:
      - '.github/workflows/prepare-0.13.12.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/0.13.12
          fetch-depth: 0

      - name: Prepare release content and exact tag marker
        shell: bash
        run: |
          set -euo pipefail
          base='1ea831511dfc895040e2058407afdc2ab8658fd7'
          git merge-base --is-ancestor "${base}" HEAD

          php <<'PHP'
          <?php
          declare(strict_types=1);

          $path = 'CHANGELOG.md';
          $text = file_get_contents($path);
          if ($text === false) {
              throw new RuntimeException('Cannot read CHANGELOG.md');
          }

          $unreleased = "## [Unreleased]\n";
          $previous = "## [0.13.11] - 2026-08-23\n";
          if (substr_count($text, $unreleased) !== 1) {
              throw new RuntimeException('Unreleased changelog heading is not unique');
          }
          if (substr_count($text, $previous) !== 1) {
              throw new RuntimeException('0.13.11 changelog anchor is not unique');
          }
          if (str_contains($text, '## [0.13.12] - 2026-08-24')) {
              throw new RuntimeException('0.13.12 section already exists');
          }

          $start = strpos($text, $unreleased);
          $previousStart = strpos($text, $previous);
          if ($start === false || $previousStart === false || $previousStart <= $start) {
              throw new RuntimeException('Cannot locate unreleased changelog body');
          }

          $bodyStart = $start + strlen($unreleased);
          $body = trim(substr($text, $bodyStart, $previousStart - $bodyStart));
          if ($body !== '') {
              throw new RuntimeException('Unreleased changelog is no longer empty; re-plan release contents');
          }

          $section = <<<'CHANGELOG'
          ## [Unreleased]

          ## [0.13.12] - 2026-08-24

          ### Changed

          - Multi-item delegated execution now defines bounded executable slices before implementation, validates each slice, continues still-authorized independent work past dependency-local blockers, distinguishes `PRE_EXISTING`, `INTRODUCED`, and `UNKNOWN_ORIGIN` validation failures when practical, and reconciles final completion claims against actual artifacts and evidence.
          - Project future-work reflection now exploits still-hot repository context to identify one highest-leverage next investment with concrete evidence, semantic owner, prerequisite, expected leverage, validation approach, and smallest independent follow-up slice while preserving `NO_FURTHER_INVESTMENT` and authority boundaries.
          - Prompt-primitives documentation now routes recurring natural-language continuation and future-investment intents to their existing semantic owners instead of encouraging duplicate prompt recipes.

          ### Validation

          - PR #108 exact head `fe3159fd54bc55ac30480698fd469aa679a80672` passed PHPUnit and PHPStan on PHP 8.3, 8.4, and 8.5 plus governed `agent-loop` context-explain dogfood in Actions run `32664987840`.
          - PR #109 exact head `9dc9528ccde4c7abf534defd04ba2ed0ab5b2deb` passed PHPUnit and PHPStan on PHP 8.3, 8.4, and 8.5 plus governed `agent-loop` context-explain dogfood in Actions run `32665686309`.
          - PR #111 exact head `7572702f8e5fd239ea3afdf6ddb93b81d65e10eb` passed PHPUnit and PHPStan on PHP 8.3, 8.4, and 8.5 plus governed `agent-loop` context-explain dogfood in Actions run `32692426818`; AccessLint and CodeRabbit were green and CodeRabbit reported no actionable comments.

          CHANGELOG;

          $updated = substr($text, 0, $start) . $section . substr($text, $previousStart);
          if (file_put_contents($path, $updated) === false) {
              throw new RuntimeException('Failed to write 0.13.12 changelog');
          }
          PHP

          rm .github/workflows/prepare-0.13.12.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md .github/workflows/prepare-0.13.12.yml
          git diff --cached --check
          git commit -m 'release: prepare 0.13.12 content'
          target="$(git rev-parse HEAD)"

          mkdir -p .release
          cat > .release/0.13.12.json <<JSON
          {
            "target_sha": "${target}",
            "version": "0.13.12"
          }
          JSON
          git add .release/0.13.12.json
          git diff --cached --check
          git commit -m 'release: request 0.13.12 tag'
          git push origin HEAD:release/0.13.12
