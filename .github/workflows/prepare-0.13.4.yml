name: Prepare 0.13.4 release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-0.13.4.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Prepare exact release metadata
        shell: bash
        run: |
          set -euo pipefail
          target='4c621e1e7ff511a7e1cc5c5aa70059b5aa532c5a'
          git merge-base --is-ancestor "${target}" HEAD

          php <<'PHP'
          <?php

          declare(strict_types=1);

          $path = 'CHANGELOG.md';
          $text = file_get_contents($path);
          if ($text === false) {
              throw new RuntimeException('Cannot read CHANGELOG.md');
          }

          $anchor = "## [0.13.3] - 2026-08-17\n";
          if (substr_count($text, $anchor) !== 1) {
              throw new RuntimeException('0.13.3 changelog anchor is not unique');
          }
          if (str_contains($text, '## [0.13.4] - 2026-08-17')) {
              throw new RuntimeException('0.13.4 section already exists');
          }

          $section = <<<'CHANGELOG'
          ## [0.13.4] - 2026-08-17

          ### Changed

          - `continue-until-done` now treats slice-by-slice self-confirmation as an internal continuation check only. Autonomous execution may continue while existing authority remains valid and evidence supports the next step, but it cannot satisfy human, owner, reviewer, accepted-risk, or approved-contract decisions by confirming itself.
          - Crossing an external authority boundary now requires `HUMAN_DECISION_REQUIRED` / `BLOCKED`, while successful completion requires the configured Done condition to be satisfied by observed evidence.

          ### Validation

          - PR #82 first reproduced the missing authority boundary with a test-only red regression, then passed PHPUnit and PHPStan on PHP 8.3, 8.4, and 8.5 plus the governed installed `agent-loop` context-explain dogfood.
          - Exact release target `4c621e1e7ff511a7e1cc5c5aa70059b5aa532c5a` passed main-branch CI run #374 after merge. CodeRabbit was rate-limited for #82, so no external-review claim is made.

          CHANGELOG;

          $updated = str_replace($anchor, $section . $anchor, $text, $count);
          if ($count !== 1) {
              throw new RuntimeException('Failed to insert 0.13.4 changelog section');
          }
          if (file_put_contents($path, $updated) === false) {
              throw new RuntimeException('Cannot write CHANGELOG.md');
          }
          PHP

          mkdir -p .release
          cat > .release/0.13.4.json <<'JSON'
          {
            "target_sha": "4c621e1e7ff511a7e1cc5c5aa70059b5aa532c5a",
            "version": "0.13.4"
          }
          JSON

          rm .github/workflows/prepare-0.13.4.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md .release/0.13.4.json .github/workflows/prepare-0.13.4.yml
          git diff --cached --check
          git commit -m 'release: prepare 0.13.4'
          git tag -a '0.13.4' "${target}" -m 'agent-recall-compiler 0.13.4'
          git push --atomic origin HEAD:main refs/tags/0.13.4
