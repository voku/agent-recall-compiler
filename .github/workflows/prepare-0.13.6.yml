name: Prepare 0.13.6 release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-0.13.6.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Prepare exact release metadata
        shell: bash
        run: |
          set -euo pipefail
          target='48163965e84007728246a10ba8ccd4bf9e4de078'
          git merge-base --is-ancestor "${target}" HEAD

          php <<'PHP'
          <?php

          declare(strict_types=1);

          $path = 'CHANGELOG.md';
          $text = file_get_contents($path);
          if ($text === false) {
              throw new RuntimeException('Cannot read CHANGELOG.md');
          }

          $anchor = "## [0.13.5] - 2026-08-18\n";
          if (substr_count($text, $anchor) !== 1) {
              throw new RuntimeException('0.13.5 changelog anchor is not unique');
          }
          if (str_contains($text, '## [0.13.6] - 2026-08-18')) {
              throw new RuntimeException('0.13.6 section already exists');
          }

          $section = <<<'CHANGELOG'
          ## [0.13.6] - 2026-08-18

          ### Added

          - Add `ReviewReportReader`, `ReviewReportArtifact`, and `ReviewReportPaths` so PHP lifecycle hosts can consume the current blind-spot report and its exact persisted SHA-256 identity without reconstructing Recall's file layout or JSON schema.

          ### Changed

          - `ReviewReportWriter` now uses the same canonical path owner as the reader without changing the existing review artifact layout.
          - Present-but-invalid, task-mismatched, binding-invalid, or internally inconsistent review reports fail explicitly; only an actually missing report returns `null`.
          - Review artifact identity remains evidence only: Recall does not infer or record acknowledgement authority for lifecycle hosts.

          ### Validation

          - PR #87 added focused regressions for missing state, exact persisted-byte identity, Contract/snapshot binding preservation, task mismatch, and status/finding consistency.
          - GitHub Actions for the final PR head remained queued due runner congestion at merge time, so no green-CI claim is made for this release. The exact diff was reviewed before merge and the decoded report shape was made explicit for static analysis.

          CHANGELOG;

          $updated = str_replace($anchor, $section . $anchor, $text, $count);
          if ($count !== 1) {
              throw new RuntimeException('Failed to insert 0.13.6 changelog section');
          }
          if (file_put_contents($path, $updated) === false) {
              throw new RuntimeException('Cannot write CHANGELOG.md');
          }
          PHP

          mkdir -p .release
          cat > .release/0.13.6.json <<'JSON'
          {
            "target_sha": "48163965e84007728246a10ba8ccd4bf9e4de078",
            "version": "0.13.6"
          }
          JSON

          rm .github/workflows/prepare-0.13.6.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md .release/0.13.6.json .github/workflows/prepare-0.13.6.yml
          git diff --cached --check
          git commit -m 'release: prepare 0.13.6'
          git tag -a '0.13.6' "${target}" -m 'agent-recall-compiler 0.13.6'
          git push --atomic origin HEAD:main refs/tags/0.13.6
