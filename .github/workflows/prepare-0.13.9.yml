name: Prepare 0.13.9 release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-0.13.9.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Prepare exact release metadata
        shell: bash
        run: |
          set -euo pipefail
          target='fad919db1593dce64cc854461822d7dba9c7f1ab'
          git merge-base --is-ancestor "${target}" HEAD

          php <<'PHP'
          <?php
          declare(strict_types=1);
          $path = 'CHANGELOG.md';
          $text = file_get_contents($path);
          if ($text === false) { throw new RuntimeException('Cannot read CHANGELOG.md'); }
          $anchor = "## [0.13.8] - 2026-08-19\n";
          if (substr_count($text, $anchor) !== 1) { throw new RuntimeException('0.13.8 changelog anchor is not unique'); }
          if (str_contains($text, '## [0.13.9] - 2026-08-19')) { throw new RuntimeException('0.13.9 section already exists'); }
          $section = <<<'CHANGELOG'
          ## [0.13.9] - 2026-08-19

          ### Added

          - Let `RecallFactsDocumentReader` own the standalone facts-document path through `path()` and `readFromOutputDirectory()`, so hosts no longer need to know the private `facts.json` filename.

          ### Validation

          - PR #96 passed PHPUnit and PHPStan on PHP 8.3, 8.4, and 8.5 plus governed `agent-loop` dogfood; CodeRabbit reported no actionable review thread on the final head.

          CHANGELOG;
          $updated = str_replace($anchor, $section . $anchor, $text, $count);
          if ($count !== 1 || file_put_contents($path, $updated) === false) { throw new RuntimeException('Failed to write 0.13.9 changelog'); }
          PHP

          mkdir -p .release
          cat > .release/0.13.9.json <<'JSON'
          {
            "target_sha": "fad919db1593dce64cc854461822d7dba9c7f1ab",
            "version": "0.13.9"
          }
          JSON

          rm .github/workflows/prepare-0.13.9.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md .release/0.13.9.json .github/workflows/prepare-0.13.9.yml
          git diff --cached --check
          git commit -m 'release: prepare 0.13.9'
          git tag -a '0.13.9' "${target}" -m 'agent-recall-compiler 0.13.9'
          git push --atomic origin HEAD:main refs/tags/0.13.9
