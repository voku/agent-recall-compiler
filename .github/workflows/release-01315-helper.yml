name: Prepare 0.13.15 release

on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-01315-helper.yml']

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Insert release notes and remove helper
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('CHANGELOG.md')
          text = path.read_text()
          marker = '## [Unreleased]\n'
          section = '''## [0.13.15] - 2026-08-26\n\n### Added\n\n- Publish the read-only `OperatingPromptCatalog` embedding API with immutable recipe, argument, validation, and deterministic preview projections so hosts can build prompt tooling without parsing Recall manifests or rendered CLI output.\n- Expose Recall-owned recipe presentation/input metadata and owner-derived applicability signals, including whether task context or current mutation authority is required and whether free-form developer instructions are allowed.\n\n### Changed\n\n- Route `OperatingPromptRecallProvider` through the same public catalog used by embedding hosts, keeping recipe parsing/rendering and validation under one semantic owner while preserving legacy schema-1.0 custom manifests.\n- Harden marker-driven release tagging and document the Recall owner/dependency boundary plus the anti-premature-completion concepts that should be adapted without creating duplicate lifecycle or evidence authorities.\n\n### Fixed\n\n- Keep direct operating-prompt request and recipe/argument runtime guards both fail-closed at runtime and valid under PHPStan after the typed catalog API landed.\n\n### Validation\n\n- PR #126 merged the typed catalog/preview boundary after exact-head PHPUnit/PHPStan verification; PR #127 added owner-derived applicability coverage for execute, dispatch, discovery, and start scenarios.\n- The post-merge runtime-guard correction is included in this release target, and the release remains gated by the repository PHP 8.3/8.4/8.5 PHPUnit + PHPStan matrix.\n\n'''
          if '## [0.13.15] - 2026-08-26' in text:
              raise SystemExit('0.13.15 already documented')
          if text.count(marker) != 1:
              raise SystemExit('unexpected Unreleased marker count')
          path.write_text(text.replace(marker, marker + '\n' + section, 1))
          PY
          rm .github/workflows/release-01315-helper.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md .github/workflows/release-01315-helper.yml
          git diff --cached --check
          git commit -m 'release: prepare 0.13.15'
          git push origin HEAD:main
          echo "TARGET_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Request exact release tag
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .release
          cat > .release/0.13.15.json <<JSON
          {
            "target_sha": "${TARGET_SHA}",
            "version": "0.13.15"
          }
          JSON
          git add .release/0.13.15.json
          git diff --cached --check
          git commit -m 'release: request 0.13.15'
          git push origin HEAD:main