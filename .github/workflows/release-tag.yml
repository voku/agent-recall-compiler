name: Tag release

on:
  push:
    branches: [main]
    paths:
      - '.release/*.json'
      - 'CHANGELOG.md'

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create requested release tags
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          markers=(.release/*.json)
          if [ "${#markers[@]}" -eq 0 ]; then
            echo 'No release markers found.' >&2
            exit 1
          fi

          for marker in "${markers[@]}"; do
            version="$(jq -er '.version' "$marker")"
            target="$(jq -er '.target_sha' "$marker")"

            if [[ "$version" != "$(basename "$marker" .json)" ]]; then
              echo "Marker filename/version mismatch: $marker -> $version" >&2
              exit 1
            fi
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid release version: $version" >&2
              exit 1
            fi
            if ! grep -Fq "## [$version] - " CHANGELOG.md; then
              echo "Current CHANGELOG.md has no release section for $version" >&2
              exit 1
            fi

            git cat-file -e "${target}^{commit}"
            if ! git merge-base --is-ancestor "$target" HEAD; then
              echo "Release target $target for $version is not an ancestor of current main" >&2
              exit 1
            fi

            # Existing historical tags are immutable release evidence. Keep the
            # workflow idempotent as long as the marker still names that exact
            # target, even if an older release predates stricter target checks.
            if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
              existing="$(git rev-list -n 1 "$version")"
              if [[ "$existing" != "$target" ]]; then
                echo "Tag $version already exists at $existing, expected $target" >&2
                exit 1
              fi
              echo "Tag $version already points to $target"
              continue
            fi

            # A new tag must point at release-ready content, not merely at an
            # older feature commit while main happens to contain the metadata.
            if ! git show "${target}:CHANGELOG.md" | grep -Fq "## [$version] - "; then
              echo "Release target $target does not contain the $version changelog section" >&2
              exit 1
            fi

            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$version" "$target" -m "agent-recall-compiler $version"
            git push origin "refs/tags/$version"
          done
