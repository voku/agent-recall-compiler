# Temporary diagnostics for NVIDIA/SkillSpector parser regressions.
# This does not replace or relax the immutable SkillEvaluator Tier 1 gate.
# Pin the upstream source commit, run with no LLM, no secrets and read-only permissions.
name: SkillSpector upstream diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/skillspector-upstream-diagnostic.yml'
      - 'resources/skills/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upstream-diagnostic:
    name: Scan affected skills with pinned upstream
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out skills
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Check out NVIDIA SkillSpector
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: NVIDIA/SkillSpector
          ref: c81615007d40e86051a302a3cf897f8a05264928
          path: .upstream-skillspector
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install pinned source in an isolated environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/skillspector-venv"
          "$RUNNER_TEMP/skillspector-venv/bin/python" -m pip install --no-input --disable-pip-version-check ./.upstream-skillspector

      - name: Scan previously failing skills without LLM
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p diagnostic-reports
          failures=0
          scanner="$RUNNER_TEMP/skillspector-venv/bin/skillspector"
          for skill in resources/skills/agent-recall-consumer; do
            name="${skill##*/}"
            report="diagnostic-reports/${name}.json"
            echo "Scanning $skill with NVIDIA/SkillSpector@c81615007d40e86051a302a3cf897f8a05264928"
            "$scanner" scan "$skill" --no-llm --format json --output "$report" --fail-on-incomplete
            code=$?
            if (( code != 0 )); then
              failures=1
            fi
            if [[ ! -s "$report" ]]; then
              echo "::error file=$skill::SkillSpector did not produce a JSON report (exit $code)"
              failures=1
              continue
            fi
            "$RUNNER_TEMP/skillspector-venv/bin/python" - "$skill" "$report" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import pathlib
          import sys

          skill, report_path, summary_path = sys.argv[1:]
          report = json.loads(pathlib.Path(report_path).read_text(encoding="utf-8"))
          with pathlib.Path(summary_path).open("a", encoding="utf-8") as stream:
              stream.write(f"### {skill}\n\n")
              stream.write("Pinned source: NVIDIA/SkillSpector@c81615007d40e86051a302a3cf897f8a05264928\n\n")
              stream.write("Analysis completeness:\n\n```json\n")
              stream.write(json.dumps(report.get("analysis_completeness", "not present"), indent=2))
              stream.write("\n```\n\n")
              issues = report.get("issues", [])
              if isinstance(issues, list):
                  stream.write(f"Reported issues: {len(issues)}\n\n")
                  for item in issues[:20]:
                      if isinstance(item, dict):
                          stream.write(f"- {str(item.get('severity', '?'))[:20]}: {str(item.get('finding', item.get('rule_id', '?')))[:200]}\n")
              stream.write("\n")
          PY
            if (( $? != 0 )); then
              failures=1
            fi
          done
          exit "$failures"

      - name: Retain scanner evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: skillspector-upstream-diagnostics
          path: diagnostic-reports/*.json
          if-no-files-found: warn
          retention-days: 7
